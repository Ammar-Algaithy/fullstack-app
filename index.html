<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Ammar Algaithy | Full Stack Developer</title>
    </head>
    <body>
        <header>
            <img src="https://github.com/Ammar-Algaithy.png" alt="Ammar Algaithy's GitHub profile photo"> 
            <h1>Ammar's Page</h1>
            <p>I am learning full stack development.</p>
            <nav>
                <a href="#skills">Skills</a>
                <a href="#goals">Goals</a>
                <a href="#github">GitHub</a>
            </nav>
        </header>
        <main>
            <section id="skills">
                <h2>My Skills</h2>
                <ul>
                    <li>Team Player</li>
                    <li>Python</li>
                    <li>SQL</li>
                </ul>
            </section>
            <section id="goals">
                <h2>My Goals</h2>
                <ol>
                    <li>Learn HTML</li>
                    <li>Learn CSS</li>
                    <li>Become <strong>full</strong> stack developer</li>
                </ol>
            </section>
            <section id="contact">
                <h2>Contact me</h2>
                <form action="/contact" method="POST">
                    <fieldset>
                        <legend>Your details</legend>
                        <div>
                            <label for="name">Your name</label>
                            <input type="text" id="name" name="name" required minlength="3">
                        </div>
                        <div>
                            <label for="email">Your email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legned>Reason</legned>
                        <div>
                            <label for="job">
                                <input type="radio" name="reason" id="job" value="job" checked>
                                Job
                            </label>
                        </div>
                        <div>
                            <label for="project">
                                <input type="radio" name="reason" id="project" value="project">
                                Project
                            </label>
                        </div>
                        <div>
                            <label for="other">
                                <input type="radio" name="reason" id="other" value="other">
                                Other
                            </label>
                        </div>
                    </fieldset>
                    <fieldset>
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required maxlength="500"></textarea>
                    </fieldset>
                    <div>
                        <input type="checkbox" name="get-copy" id="get-copy">
                        <label>Send me a copy</label>
                    </div>
                    <button type="submit">Send</button>
                </form>
            </section>
        </main>
        
        <footer>
            <p id="github">My code lives on <em><a href="https://github.com/Ammar-Algaithy">my GitHub</a></em>.</p>
            <p>© 2026 Ammar Algaithy</p>
        </footer>
    </body>
</html>
